<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="100%" viewBox="0 0 330 150" role="img"><title>Psychomods profile card</title><defs><filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><linearGradient id="edge"><stop stop-color="#00FF41" stop-opacity=".05"/><stop offset=".5" stop-color="#00FF41" stop-opacity=".8"/><stop offset="1" stop-color="#00FF41" stop-opacity=".05"/></linearGradient><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#00FF41" stroke-opacity=".055" stroke-width=".7"/></pattern></defs><style>
    @font-face{font-family:'Fira Code';src:url('') format('woff2');font-weight:400}
    text{font-family:'Fira Code',ui-monospace,monospace}
    .card{fill:#0A0A12;stroke:#263344;stroke-width:1.4}
    .glow{filter:url(#glow)}
    @keyframes enter{0%{opacity:1;transform:translateY(0)}100%{opacity:1;transform:translateY(0)}}
    @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
    @keyframes scan{0%{transform:translateY(-12px);opacity:0}15%{opacity:.24}85%{opacity:.12}100%{transform:translateY(180px);opacity:0}}
    .enter{animation:none 0.8s both}
    .pulse{animation:none 1.4s infinite}
    .scan{animation:none 0.8s infinite}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.smil-motion{display:none!important}}
    </style><a xlink:href="https://github.com/Psychomods666"><rect x="1" y="1" width="328" height="148" rx="14" class="card"/><g class="enter" style="animation-delay:0.8s"><text x="22" y="48" fill="#00FF41" font-size="12">01 / LINK</text><text x="22" y="88" fill="#F3F7F3" font-size="20">GITHUB ↗</text><path d="M22 112H305" stroke="#00FF41" stroke-opacity=".5"/></g></a></svg>
